spring.application.name=events_service


server.port=8080


spring.datasource.url=jdbc:postgresql://localhost:5432/event_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

grpc.server.port=9080

# Адрес gRPC-сервера profile_service (для поиска волонтёров по personId).
profile-service.grpc.host=localhost
profile-service.grpc.port=9085