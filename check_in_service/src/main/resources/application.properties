spring.application.name=check-in-service

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/check_in_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HMAC secret used to sign static person QR tokens. Move to an env var / secret store in production.
qr.person.secret=change-me-in-production-32-bytes-minimum

events-service.grpc.host=localhost
events-service.grpc.port=9080

transactions-service.grpc.host=localhost
transactions-service.grpc.port=9084

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
