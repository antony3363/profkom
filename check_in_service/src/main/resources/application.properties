spring.application.name=check_in_service

# HMAC secret used to sign static person QR tokens. Move to an env var / secret store in production.
qr.person.secret=change-me-in-production-32-bytes-minimum

# events_service base URL, used to resolve a segment's parent event when generating/validating segment QR codes.
events-service.base-url=http://localhost:8080
