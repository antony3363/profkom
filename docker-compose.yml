name: profkom

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  eureka-server:
    build: ./eureka_server
    ports:
      - "8761:8761"

  auth-service:
    build: ./auth_service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
    environment:
      DB_HOST: postgres
      EUREKA_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SWAGGER_HOST: ${SWAGGER_HOST:-localhost}
    ports:
      - "8081:8081"

  events-service:
    build: ./events_service
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      DB_HOST: postgres
      EUREKA_URL: http://eureka-server:8761/eureka/
      PROFILE_SERVICE_HOST: profile-service
    ports:
      - "8080:8080"

  check-in-service:
    build: ./check_in_service
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      DB_HOST: postgres
      EUREKA_URL: http://eureka-server:8761/eureka/
      EVENTS_SERVICE_HOST: events-service
      TRANSACTIONS_SERVICE_HOST: transactions-service
    ports:
      - "8082:8082"

  shop-service:
    build: ./shop_service
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      DB_HOST: postgres
      EUREKA_URL: http://eureka-server:8761/eureka/
      TRANSACTIONS_SERVICE_HOST: transactions-service
    ports:
      - "8083:8083"

  transactions-service:
    build: ./transactions_service
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      DB_HOST: postgres
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports:
      - "8084:8084"

  profile-service:
    build: ./profile_service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
    environment:
      DB_HOST: postgres
      EUREKA_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8085:8085"

  gateway-service:
    build: ./gateway_service
    depends_on:
      eureka-server:
        condition: service_started
      auth-service:
        condition: service_started
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      AUTH_SERVICE_URL: http://auth-service:8081
    ports:
      - "8090:8090"

volumes:
  postgres-data:
