spring.application.name=shop-service

server.port=8083

server.tomcat.threads.max=20

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/shop_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

transactions-service.grpc.host=${TRANSACTIONS_SERVICE_HOST:localhost}
transactions-service.grpc.port=9084

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
