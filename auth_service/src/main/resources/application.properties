spring.application.name=auth-service

server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/auth_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Время жизни access/refresh токенов
auth.jwt.access-token-ttl-minutes=15
auth.jwt.refresh-token-ttl-days=30

# Единый Swagger UI со всеми микросервисами (выпадающий список вверху страницы).
# Открывать: http://localhost:8081/swagger-ui.html
# Временное решение до появления API Gateway — держать в одном сервисе, а не
# заводить отдельный модуль ради одной страницы.
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=Events Service
springdoc.swagger-ui.urls[1].url=http://localhost:8080/v3/api-docs
springdoc.swagger-ui.urls[2].name=Check-in Service
springdoc.swagger-ui.urls[2].url=http://localhost:8082/v3/api-docs
springdoc.swagger-ui.urls[3].name=Shop Service
springdoc.swagger-ui.urls[3].url=http://localhost:8083/v3/api-docs
springdoc.swagger-ui.urls[4].name=Transactions Service
springdoc.swagger-ui.urls[4].url=http://localhost:8084/v3/api-docs
springdoc.swagger-ui.urls[5].name=Profile Service
springdoc.swagger-ui.urls[5].url=http://localhost:8085/v3/api-docs

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Kafka: публикуем user-registered (Profile Service слушает и создаёт профиль,
# если пришли email/имя), слушаем school-proforg-changed (Profile Service публикует
# при смене School.proforgId) — назначаем/снимаем роль PROFORG_SCHOOL.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=auth-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.auth_service.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.auth_service.kafka.SchoolProforgChangedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
