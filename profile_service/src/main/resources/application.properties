spring.application.name=profile-service

server.port=8085

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/profile_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

grpc.server.port=9085

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Kafka: публикуем school-proforg-changed (Auth Service слушает и назначает/снимает
# роль PROFORG_SCHOOL), слушаем user-registered (Auth Service публикует при первом
# входе) — создаём профиль, если пришли email/имя.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=profile-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.profile_service.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.profile_service.kafka.UserRegisteredEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
