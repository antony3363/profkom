spring:
  application:
    name: gateway_service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
            - id: events-service
              uri: lb://events-service
              predicates:
                - Path=/api/v1/events/**,/api/v1/volunteer_records/**
            - id: check-in-service
              uri: lb://check-in-service
              predicates:
                - Path=/api/v1/check-ins/**,/api/v1/registrations/**,/api/v1/qr/**
            - id: shop-service
              uri: lb://shop-service
              predicates:
                - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/product-media/**,/api/v1/purchases/**
            - id: transactions-service
              uri: lb://transactions-service
              predicates:
                - Path=/api/v1/wallets/**,/api/v1/transactions/**
            - id: profile-service
              uri: lb://profile-service
              predicates:
                - Path=/api/v1/schools/**,/api/v1/programs/**,/api/v1/groups/**,/api/v1/profiles/**

server:
  port: 8090

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# Прямой (не через Eureka) адрес auth_service — используется только для интроспекции
# токена внутри AuthenticationGlobalFilter.
auth-service:
  base-url: ${AUTH_SERVICE_URL:http://localhost:8081}

logging:
  level:
    org.springframework.cloud.gateway: INFO
